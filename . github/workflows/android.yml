name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Siapkan Node.js terlebih dahulu
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Siapkan Java SEKITAR AWAL (Agar Capacitor mengenali environment Android saat sync)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. Install dependencies npm
      - name: Install dependencies
        run: npm install

      # 4. Build Web Assets (Vite) dengan menyertakan Secret API Key
      - name: Build Web Assets (Vite)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # 5. Sinkronkan Capacitor SETELAH environment Android siap dan web sudah di-build
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. Build APK Android via Gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload hasil APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NabungAH-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
